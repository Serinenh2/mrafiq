server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; }
  location /admin/ { proxy_pass http://backend:8000/admin/; proxy_set_header Host $host; }
  location /media/ { proxy_pass http://backend:8000/media/; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
